<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Belle ❤️</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>
    <style>
        body { margin: 0; overflow: hidden; }
        .bg-custom {
            background-image: url('https://images.unsplash.com/photo-1518199266791-5375a83190b7?auto=format&fit=crop&w=1600&q=80');
            background-size: cover;
            background-position: center;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useRef } = React;
        const { motion, AnimatePresence } = window.Motion;

        function ValentinePage() {
            const [answered, setAnswered] = useState(false);
            const [noPosition, setNoPosition] = useState({ x: 0, y: 0 });
            const [yesScale, setYesScale] = useState(1);
            const audioRef = useRef(null);

            const startMusic = () => {
                if (audioRef.current && audioRef.current.paused) {
                    audioRef.current.play().catch(e => console.log("Playback interaction required"));
                }
            };

            const moveNoButton = () => {
                startMusic();
                const randomX = Math.floor(Math.random() * 200 - 100);
                const randomY = Math.floor(Math.random() * 200 - 100);
                setNoPosition({ x: randomX, y: randomY });
                setYesScale(prev => prev + 0.2); // Makes Yes button bigger
            };

            const handleYesClick = () => {
                startMusic();
                setAnswered(true);
                // Notification via email
                window.location.href = "mailto:majanimanuel@gmail.com?subject=She Said Yes! ❤️&body=Belle said YES to being my Valentine! ❤️";
            };

            return (
                <div className="min-h-screen bg-custom flex items-center justify-center p-6 relative">
                    {/* Mariah Carey - Always Be My Baby */}
                    <audio ref={audioRef} loop>
                        <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg" />
                    </audio>

                    <div className="absolute inset-0 bg-black/40 backdrop-blur-[2px]" />

                    <div className="relative z-10 w-full max-w-xl bg-white/90 p-10 rounded-3xl shadow-2xl text-center border-none">
                        {!answered ? (
                            <motion.div initial={{ opacity: 0 }} animate={{ opacity: 1 }}>
                                <h1 className="text-5xl font-extrabold text-red-600 mb-2">Belle ❤️</h1>
                                <p className="text-xl text-gray-800 italic mb-6">"You'll always be a part of me..."</p>
                                <h2 className="text-2xl font-bold text-gray-900 mb-8">Will You Be My Valentine?</h2>

                                <div className="flex justify-center items-center gap-12 mt-4">
                                    <motion.button 
                                        style={{ scale: yesScale }}
                                        onClick={handleYesClick}
                                        className="bg-red-600 hover:bg-red-700 text-white px-10 py-4 rounded-full text-xl font-bold shadow-xl transition-colors">
                                        Yes! 🌹
                                    </motion.button>

                                    <motion.button 
                                        animate={{ x: noPosition.x, y: noPosition.y }}
                                        onMouseEnter={moveNoButton}
                                        onTouchStart={moveNoButton}
                                        className="border-2 border-gray-400 px-8 py-4 rounded-full text-xl text-gray-700 bg-transparent">
                                        No
                                    </motion.button>
                                </div>
                            </motion.div>
                        ) : (
                            <motion.div initial={{ scale: 0.5, opacity: 0 }} animate={{ scale: 1, opacity: 1 }} className="py-10">
                                <h2 className="text-5xl font-black text-red-600 mb-4">She Said YES! ❤️</h2>
                                <p className="text-2xl text-gray-700 italic">"Always be my baby..."</p>
                                <div className="mt-8 flex justify-center gap-4">
                                    {[...Array(20)].map((_, i) => (
                                        <motion.div 
                                            key={i}
                                            animate={{ y: [0, -20, 0] }}
                                            transition={{ repeat: Infinity, duration: 1, delay: i * 0.1 }}
                                            className="text-3xl">❤️</motion.div>
                                    ))}
                                </div>
                            </motion.div>
                        )}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ValentinePage />);
    </script>
</body>
</html>
